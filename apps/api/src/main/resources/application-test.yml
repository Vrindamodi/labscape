# Tests: throwaway embedded Postgres on a free port, wiped every run.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
labscape:
  dev-db:
    dir: ""
    port: 0
  auth:
    cookie-secure: false
    admin-bootstrap-emails: admin@test.dev
  billing:
    mode: sandbox
    webhook-secret: test-webhook-secret
