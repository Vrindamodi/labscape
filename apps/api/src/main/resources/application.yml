spring:
  application:
    name: labscape-api
  datasource:
    # Neon in staging/prod (pooled host, ?sslmode=require); local docker compose by default.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/labscape}
    username: ${DATABASE_USERNAME:labscape}
    password: ${DATABASE_PASSWORD:labscape}
    hikari:
      # Neon scales to zero; keep the pool small and tolerate cold starts.
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      connection-timeout: 15000
  flyway:
    # Migrations use the direct (non-pooled) Neon host when FLYWAY_URL is set.
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

labscape:
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  auth:
    # HS256 key for the session JWT. Must be set (>= 32 bytes) outside dev.
    jwt-secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
    session-days: 30
    cookie-name: ls_session
    cookie-secure: ${COOKIE_SECURE:true}
    # Google sign-in is enabled when a client id is configured.
    google-client-id: ${GOOGLE_CLIENT_ID:}
    # Accounts registered with these emails become super_admin (first-admin bootstrap).
    admin-bootstrap-emails: ${ADMIN_BOOTSTRAP_EMAILS:}
  billing:
    # sandbox = no money moves; a test sheet confirms payment through the same webhook path.
    # razorpay = real Razorpay Subscriptions (needs key id/secret and the webhook secret).
    mode: ${BILLING_MODE:sandbox}
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dev-webhook-secret}
  rewards:
    daily-soft-cap: 1500
    max-events-per-minute: 30
  features:
    # Flip on as each part ships; daily challenges only offer what can actually be completed.
    experiments: true
    quizzes: false
    scenarios: false
    molecular-view: true
  safety:
    # R1 ships the safety engine behind this flag. Off => /v1/safety/resolve returns 503 and the
    # playground shows no reactions at all.
    engine-enabled: ${SAFETY_ENGINE_ENABLED:true}
    probe-threshold: 3
    probe-window-seconds: 600
    cooldown-seconds: 120

springdoc:
  api-docs:
    path: /v1/openapi.json

management:
  endpoints:
    web:
      exposure:
        include: health,info
