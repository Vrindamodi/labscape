# Local development only. Staging/production use Neon (serverless Postgres) - see .env.example.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: labscape
      POSTGRES_USER: labscape
      POSTGRES_PASSWORD: labscape
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labscape"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
